<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamReel — Who's Watching</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#0b0b0d; --panel:#16151a; --ember:#e5432b; --gold:#e8b84b;
    --text:#f2f0ea; --muted:#8a8790; --input-bg:#1f1e24; --card:#1b1a20;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:32px; padding:40px;
  }
  .logo{ font-family:'Bebas Neue',sans-serif; font-size:26px; color:var(--ember); }
  h1{ font-family:'Bebas Neue',sans-serif; font-size:32px; font-weight:400; letter-spacing:1px; }

  .grid{ display:flex; gap:22px; flex-wrap:wrap; justify-content:center; max-width:720px; }

  .profile-card{
    width:130px; display:flex; flex-direction:column; align-items:center; gap:10px;
    cursor:pointer; opacity:0.9; transition:opacity 0.15s ease, transform 0.15s ease;
  }
  .profile-card:hover{ opacity:1; transform:translateY(-3px); }

  .avatar{
    width:110px; height:110px; border-radius:8px;
    background:linear-gradient(135deg,#2a1c3d,#12101a);
    display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue',sans-serif; font-size:36px; color:var(--gold);
    border:2px solid transparent;
  }
  .profile-card:hover .avatar{ border-color:var(--ember); }
  .kids-tag{
    position:relative; top:-96px; left:38px; background:var(--gold); color:#1a1a1a;
    font-size:9px; font-weight:700; letter-spacing:0.5px; padding:2px 6px; border-radius:3px;
    text-transform:uppercase;
  }
  .profile-name{ font-size:13.5px; color:var(--muted); }

  .add-card .avatar{
    background:var(--card); border:2px dashed rgba(255,255,255,0.15); color:var(--muted); font-size:40px;
  }
  .add-card:hover .avatar{ border-color:var(--ember); color:var(--ember); }

  .panel{
    display:none; width:100%; max-width:340px; background:rgba(22,21,26,0.9);
    border:1px solid rgba(255,255,255,0.06); border-radius:6px; padding:28px 26px;
  }
  .panel.open{ display:block; }
  .panel h2{ font-size:16px; margin-bottom:16px; }
  .field input{
    width:100%; padding:13px 14px; background:var(--input-bg);
    border:1px solid rgba(255,255,255,0.07); border-radius:4px; color:var(--text);
    font-size:14px; outline:none; margin-bottom:12px;
  }
  .field input:focus{ border-color:var(--ember); background:#24232a; }
  .kids-check{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin-bottom:16px; }
  .btn-row{ display:flex; gap:10px; }
  .btn{
    flex:1; padding:12px; border:none; border-radius:4px; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .btn-primary{ background:var(--ember); color:#fff; }
  .btn-primary:hover{ background:#c9391f; }
  .btn-ghost{ background:rgba(255,255,255,0.08); color:var(--text); }
  .btn-ghost:hover{ background:rgba(255,255,255,0.15); }

  .status{ font-size:13px; margin-top:12px; min-height:16px; text-align:center; }
  .status.error{ color:#ff6b57; }

  .empty-state, .loading-state{ color:var(--muted); font-size:13.5px; }
</style>
</head>
<body>

  <span class="logo">STREAMREEL</span>
  <h1>Who's watching?</h1>

  <div class="grid" id="profileGrid">
    <span class="loading-state">Loading profiles...</span>
  </div>

  <div class="panel" id="addPanel">
    <h2>Add a profile</h2>
    <div class="field"><input type="text" id="newName" placeholder="Name" maxlength="30"></div>
    <label class="kids-check"><input type="checkbox" id="newIsKids"> Kids profile</label>
    <div class="btn-row">
      <button class="btn btn-ghost" id="cancelBtn" type="button">Cancel</button>
      <button class="btn btn-primary" id="saveBtn" type="button">Save</button>
    </div>
    <div class="status" id="status"></div>
  </div>

<script src="api.js"></script>
<script>
  if (!isLoggedIn()) {
    window.location.href = "login.html";
  }

  const grid = document.getElementById('profileGrid');
  const panel = document.getElementById('addPanel');
  const statusEl = document.getElementById('status');

  function initials(name) {
    return name.trim().slice(0, 2).toUpperCase();
  }

  function selectProfile(profileId) {
    localStorage.setItem("streamreel_profile_id", profileId);
    window.location.href = "browse.html";
  }

  async function loadProfiles() {
    try {
      const profiles = await listProfiles();
      grid.innerHTML = "";

      profiles.forEach(p => {
        const card = document.createElement('div');
        card.className = 'profile-card';
        card.innerHTML = `
          <div class="avatar">${initials(p.name)}</div>
          ${p.is_kids ? '<div class="kids-tag">Kids</div>' : ''}
          <div class="profile-name">${p.name}</div>
        `;
        card.addEventListener('click', () => selectProfile(p.id));
        grid.appendChild(card);
      });

      if (profiles.length < 5) {
        const addCard = document.createElement('div');
        addCard.className = 'profile-card add-card';
        addCard.innerHTML = `<div class="avatar">+</div><div class="profile-name">Add Profile</div>`;
        addCard.addEventListener('click', () => panel.classList.add('open'));
        grid.appendChild(addCard);
      }

      if (profiles.length === 0) {
        panel.classList.add('open');
      }
    } catch (err) {
      grid.innerHTML = `<span class="empty-state">Couldn't load profiles: ${err.message}</span>`;
    }
  }

  document.getElementById('cancelBtn').addEventListener('click', () => {
    panel.classList.remove('open');
    statusEl.textContent = "";
  });

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const name = document.getElementById('newName').value.trim();
    const isKids = document.getElementById('newIsKids').checked;
    statusEl.textContent = "";
    statusEl.className = "status";

    if (!name) {
      statusEl.textContent = "Name is required.";
      statusEl.className = "status error";
      return;
    }

    try {
      const profile = await createProfile(name, isKids);
      selectProfile(profile.id);
    } catch (err) {
      statusEl.textContent = err.message || "Couldn't create profile.";
      statusEl.className = "status error";
    }
  });

  loadProfiles();
</script>

</body>
</html>
