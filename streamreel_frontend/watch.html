<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StreamReel — Watch</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');
  :root{ --bg:#0b0b0d; --ember:#e5432b; --text:#f2f0ea; --muted:#9c99a1; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
  }
  .top-bar{ width:100%; padding:16px 32px; display:flex; align-items:center; gap:16px; }
  .back-link{ color:var(--text); text-decoration:none; font-size:20px; }
  .back-link:hover{ color:var(--ember); }
  .logo{ font-family:'Bebas Neue',sans-serif; font-size:20px; color:var(--ember); }
  video{ width:92%; max-width:1000px; margin-top:24px; border-radius:8px; background:#000; }
  h1{ font-family:'Bebas Neue',sans-serif; font-size:28px; margin:18px 0 4px; text-align:center; }
  .no-url{ color:var(--muted); margin-top:60px; font-size:14px; }
</style>
</head>
<body>
  <div class="top-bar">
    <a class="back-link" href="browse.html">&larr;</a>
    <span class="logo">STREAMREEL</span>
  </div>
  <h1 id="videoTitle">Loading...</h1>
  <video id="player" controls autoplay></video>
  <div class="no-url" id="noUrlMsg" style="display:none;">No video URL available for this title.</div>

<script src="api.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const title = params.get('title') || 'Untitled';
  const url = params.get('url');
  const videoId = params.get('id');
  const profileId = localStorage.getItem('streamreel_profile_id');

  document.getElementById('videoTitle').textContent = title;

  const player = document.getElementById('player');

  if (url) {
    player.src = url;

    // Only try to resume AFTER the browser knows the real video length —
    // setting currentTime too early (or beyond the real duration) is what
    // causes the video to appear to "skip"/jump on start.
    player.addEventListener('loadedmetadata', () => {
      if (videoId && profileId) {
        getResumePosition(profileId, videoId)
          .then(res => {
            const saved = res && res.position_seconds ? res.position_seconds : 0;
            // Clamp so we never seek past (or too close to) the real end.
            const safePosition = Math.min(saved, Math.max(player.duration - 5, 0));
            if (safePosition > 0) {
              player.currentTime = safePosition;
            }
          })
          .catch(() => {}); // fine if this fails, just start from 0
      }
    });

    // Save progress every 10 seconds while playing.
    let saveTimer = null;
    player.addEventListener('play', () => {
      if (saveTimer) return;
      saveTimer = setInterval(() => {
        if (videoId && profileId && !player.paused) {
          saveWatchPosition(profileId, videoId, Math.floor(player.currentTime)).catch(() => {});
        }
      }, 10000);
    });

    // Also save once when the user leaves the page.
    window.addEventListener('beforeunload', () => {
      if (videoId && profileId) {
        saveWatchPosition(profileId, videoId, Math.floor(player.currentTime)).catch(() => {});
      }
    });
  } else {
    player.style.display = 'none';
    document.getElementById('noUrlMsg').style.display = 'block';
  }
</script>
</body>
</html>
