<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StreamReel — Watch</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');
  :root{ --bg:#0b0b0d; --ember:#e5432b; --text:#f2f0ea; --muted:#9c99a1; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
  }
  .top-bar{ width:100%; padding:16px 32px; display:flex; align-items:center; gap:16px; }
  .back-link{ color:var(--text); text-decoration:none; font-size:20px; }
  .back-link:hover{ color:var(--ember); }
  .logo{ font-family:'Bebas Neue',sans-serif; font-size:20px; color:var(--ember); }
  video, iframe{ width:92%; max-width:1000px; margin-top:24px; border-radius:8px; background:#000; border:none; }
  video, iframe{ aspect-ratio:16/9; }
  h1{ font-family:'Bebas Neue',sans-serif; font-size:28px; margin:18px 0 4px; text-align:center; }
  .trailer-note{ color:var(--muted); font-size:12px; margin-top:10px; }
  .status-msg{ color:var(--muted); margin-top:40px; font-size:14px; text-align:center; max-width:600px; padding:0 20px; }
  .status-msg.error{ color:#ff6b57; }
</style>
</head>
<body>
  <div class="top-bar">
    <a class="back-link" href="browse.html">&larr;</a>
    <span class="logo">STREAMREEL</span>
  </div>
  <h1 id="videoTitle">Loading...</h1>

  <video id="player" controls style="display:none;"></video>
  <iframe id="ytPlayer" style="display:none;" allow="autoplay; encrypted-media" allowfullscreen></iframe>

  <div class="trailer-note" id="trailerNote"></div>
  <div class="status-msg" id="statusMsg"></div>

<script>
  const params = new URLSearchParams(window.location.search);
  const title = params.get('title') || 'Untitled';
  const url = params.get('url');

  document.getElementById('videoTitle').textContent = title;

  const player = document.getElementById('player');
  const ytPlayer = document.getElementById('ytPlayer');
  const statusMsg = document.getElementById('statusMsg');
  const trailerNote = document.getElementById('trailerNote');

  if (!url) {
    statusMsg.textContent = "No video URL was provided for this title.";
    statusMsg.className = "status-msg error";
  } else if (url.includes('youtube.com/embed/')) {
    // Real movie trailer from TMDB/YouTube.
    ytPlayer.src = url;
    ytPlayer.style.display = 'block';
    trailerNote.textContent = "Official trailer";
  } else {
    // Fallback sample clip.
    player.style.display = 'block';
    trailerNote.textContent = "Sample clip (no official trailer found for this title)";
    statusMsg.textContent = "Loading video...";

    player.addEventListener('loadeddata', () => {
      statusMsg.textContent = "";
    });

    player.addEventListener('error', () => {
      let reason = "Unknown error";
      if (player.error) {
        switch (player.error.code) {
          case 1: reason = "Loading was aborted."; break;
          case 2: reason = "A network error occurred while loading."; break;
          case 3: reason = "The video could not be decoded (unsupported format)."; break;
          case 4: reason = "This video format/source is not supported, or the link is broken."; break;
        }
      }
      statusMsg.textContent = "Couldn't play this video: " + reason;
      statusMsg.className = "status-msg error";
    });

    player.src = url;
    player.load();
    player.play().catch(() => {
      // Autoplay can be blocked by the browser — fine, user can press play manually.
    });
  }
</script>
</body>
</html>
