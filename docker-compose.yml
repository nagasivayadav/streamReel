services:
  backend:
    build: ./streamreel_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/streamreel
      JWT_SECRET: change-this-in-production
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: streamreel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"

  frontend:
    build: ./streamreel_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
